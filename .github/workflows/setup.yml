name: Setup and Probe

# Everything here runs on a GitHub runner, which can reach Apify and Google. Nothing
# needs the repository cloned locally: add the secrets in repo Settings, pick a task
# from the Actions tab, read the result in the run summary.

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        type: choice
        required: true
        default: probe-actors
        options:
          - probe-actors
          - setup-sheet
          - run-once-no-send
      query:
        description: 'Search term for probe-actors'
        type: string
        required: false
        default: 'sales operations'

  # A mapping change is exactly when the mapping needs re-verifying, so editing
  # config/actors.json re-probes on its own. The path filter is the point: an
  # unfiltered trigger would spend Apify credit on every unrelated commit.
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'config/actors.json'
      - 'src/sources/**'
      - 'scripts/probe-actor.js'
      # Changing the probe is itself a reason to re-probe, and leaving this out means
      # a change to how verification works never gets verified.
      - '.github/workflows/setup.yml'

concurrency:
  group: opportunity-finder
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_BACKEND: ${{ vars.LLM_BACKEND || 'claude_code' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      ENRICHMENT_PROVIDER: stub
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # A push carries no workflow inputs, so the task has to be resolved rather than
      # read straight from inputs.
      - name: Resolve task
        id: task
        shell: bash
        run: |
          echo "name=${{ inputs.task || 'probe-actors' }}" >> "$GITHUB_OUTPUT"
          echo "query=${{ inputs.query || 'sales operations' }}" >> "$GITHUB_OUTPUT"

      - name: Skip when Apify is not configured
        id: configured
        shell: bash
        run: |
          if [ -n "$APIFY_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "APIFY_TOKEN is not set, so there is nothing to probe. This run is a no-op." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Claude Code
        if: steps.task.outputs.name == 'run-once-no-send' && env.LLM_BACKEND != 'api'
        run: npm install -g @anthropic-ai/claude-code

      # Probes each actor once on five results. Costs a few cents of Apify credit and
      # prints which mapped fields in config/actors.json actually resolve.
      - name: Probe actors
        if: steps.task.outputs.name == 'probe-actors' && steps.configured.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo '## Actor probe results'
            echo
            echo "commit: ${{ github.sha }}"
            echo "query: ${{ steps.task.outputs.query }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          for source in upwork linkedin indeed; do
            echo "::group::$source"
            echo "### $source" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            # Output is captured to a file rather than piped, so node's exit code
            # survives. A dead actor id is itself a finding and must not read as
            # success, and one failing source must not stop the other two.
            if node scripts/probe-actor.js "$source" "${{ steps.task.outputs.query }}" > "/tmp/$source.log" 2>&1; then
              status="ok"
            else
              status="FAILED (exit $?)"
            fi

            cat "/tmp/$source.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "result: $status" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"

            cat "/tmp/$source.log"
            echo "::endgroup::"
          done

          # A compact digest at the very END of the step. The full output is three
          # actor schemas and hundreds of crawler lines, and reading it back costs more
          # than it tells you. This is the part worth reading: what each actor returned,
          # what it billed, and which mapped fields did not resolve.
          echo "::group::summary"
          {
            echo "### summary"
            echo '```'
            for source in upwork linkedin indeed; do
              echo "$source"
              grep -E '^(returned|No items|actor: )' "/tmp/$source.log" | sed 's/^/  /' || true

              # Proof the search term reached the actor. Three times now an actor has
              # accepted an undeclared input, ignored it, and returned arbitrary
              # listings that map perfectly and mean nothing. A 100% mapping is not
              # evidence the search worked; the actor echoing the query back is.
              grep -oE "(No queries provided[^\"]*|\[Query [0-9/]+\] Starting: '[^']*'|Jobs found for .*|Generated [0-9]+ LinkedIn Search URL|https://www\.linkedin\.com/jobs/search\?[^ ]*|Running site crawl .*)" "/tmp/$source.log" \
                | head -4 | sed 's/^/  search: /' || true

              grep -E '(NO HIT|[0-9]+% via)' "/tmp/$source.log" | grep -v 'Fix any NO HIT' | sed 's/^ */  /' || true
              grep -oE 'SENT BUT NOT IN SCHEMA.*' "/tmp/$source.log" | sed 's/^/  /' || true
              echo
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

      - name: Upload raw actor output
        if: steps.task.outputs.name == 'probe-actors' && steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: probe-raw-output
          path: .probe/
          if-no-files-found: warn
          retention-days: 14
          # .probe is a dot directory, and upload-artifact v4 excludes hidden files
          # by default. Without this the upload silently finds nothing.
          include-hidden-files: true

      - name: Create sheet tabs
        if: steps.task.outputs.name == 'setup-sheet'
        shell: bash
        run: |
          set -o pipefail
          node scripts/setup-sheet.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run pipeline without sending
        if: steps.task.outputs.name == 'run-once-no-send'
        run: node scripts/run-once.js --skip-send
