name: Opportunity Finder

on:
  schedule:
    # 13:00 UTC = 06:00 Arizona. Arizona does not observe DST, so this stays 6am
    # year round with no seasonal drift.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      skip_send:
        description: 'Run everything except sending'
        type: boolean
        default: false

# One run at a time. The Sheets mutex is the real guard; this stops GitHub from
# queueing a second job against it in the first place.
concurrency:
  group: opportunity-finder
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Apify actor runs dominate the wall clock. This is a ceiling, not a target.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # The schedule is live from the moment this lands on the default branch, which
      # is before any secret exists. A scheduled job that fails red every morning
      # until it is configured is noise, not signal, so it stands down cleanly and
      # starts working by itself once the secrets are added.
      - name: Check configuration
        id: configured
        shell: bash
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=()
          [ -n "$APIFY_TOKEN" ] || missing+=(APIFY_TOKEN)
          [ -n "$SHEET_ID" ] || missing+=(SHEET_ID)
          [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || missing+=(GOOGLE_SERVICE_ACCOUNT_JSON)
          if [ "${{ vars.LLM_BACKEND || 'claude_code' }}" = "api" ]; then
            [ -n "$ANTHROPIC_API_KEY" ] || missing+=(ANTHROPIC_API_KEY)
          else
            [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || missing+=(CLAUDE_CODE_OAUTH_TOKEN)
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not configured yet. Missing repository secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Add them under Settings, Secrets and variables, Actions. This run is a no-op." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The default backend runs the model through headless Claude Code on a Claude
      # subscription, so the CLI has to be present. Skipped when LLM_BACKEND=api.
      - name: Install Claude Code
        if: steps.configured.outputs.ready == 'true' && vars.LLM_BACKEND != 'api'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        if: steps.configured.outputs.ready == 'true'
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'claude_code' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # Optional. Sending is off by default (Config.sending_enabled), and the
          # digest goes to the Digest tab and this run's summary, so none of these
          # need to exist for the pipeline to work.
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DEBOUNCE_API_KEY: ${{ secrets.DEBOUNCE_API_KEY }}
          ENRICHMENT_PROVIDER: ${{ vars.ENRICHMENT_PROVIDER || 'stub' }}
          ENRICHMENT_API_KEY: ${{ secrets.ENRICHMENT_API_KEY }}
          LOG_LEVEL: info
        run: node scripts/run-once.js ${{ inputs.skip_send && '--skip-send' || '' }}
